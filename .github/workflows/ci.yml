name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Stream Deck plugin — pure TypeScript, no native deps
  plugin:
    name: Plugin (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StreamDeckPlugin/deck-term
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: StreamDeckPlugin/deck-term/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # Electron app — node-pty requires native compilation (MSVC / Xcode)
  electron:
    name: Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: DeckTerm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: DeckTerm/package-lock.json

      - name: Install dependencies (rebuilds node-pty via postinstall)
        run: npm ci

      - name: Type-check & build (electron-vite)
        run: npm run build
